<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prismatik - prévia ao vivo</title>
<style>
  :root { color-scheme: light dark; --bg: #f4f4f6; --fg: #1b1b1f; --card: #fff; --line: #d8d8de; }
  @media (prefers-color-scheme: dark) { :root { --bg: #17171a; --fg: #ececf1; --card: #232328; --line: #3a3a42; } }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  #strip { display: flex; flex-wrap: wrap; gap: 2px; }
  #strip i { width: 14px; height: 14px; border-radius: 3px; background: #000; display: block; }
  button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; margin: 2px; }
  pre { margin: 0; white-space: pre-wrap; font-size: 13px; }
  #status { font-weight: 600; }
</style>
</head>
<body>
<h1>Prismatik · prévia ao vivo</h1>
<div class="card"><span id="status">conectando…</span> · <span id="stats"></span></div>
<div class="card"><div id="strip"></div></div>
<div class="card">
  <button data-fx="pulse">Pulso laranja</button>
  <button data-fx="flash">Flash branco</button>
  <button data-fx="wave">Onda azul</button>
  <button id="stop">Parar efeitos</button>
</div>
<div class="card"><pre id="log"></pre></div>
<script>
const TOKEN = "%%PRISMATIK_TOKEN%%";
const strip = document.getElementById("strip");
const statusEl = document.getElementById("status");
const statsEl = document.getElementById("stats");
const logEl = document.getElementById("log");
let cells = [];

function log(msg) { logEl.textContent = (new Date().toLocaleTimeString() + " " + msg + "\n" + logEl.textContent).slice(0, 2000); }

function ensureCells(n) {
  if (cells.length === n) return;
  strip.textContent = "";
  cells = [];
  for (let i = 0; i < n; i++) { const c = document.createElement("i"); c.title = "LED " + i; strip.appendChild(c); cells.push(c); }
}

function drawFrame(b64) {
  const bin = atob(b64);
  ensureCells(bin.length / 3);
  for (let i = 0; i < cells.length; i++)
    cells[i].style.background = "rgb(" + bin.charCodeAt(i * 3) + "," + bin.charCodeAt(i * 3 + 1) + "," + bin.charCodeAt(i * 3 + 2) + ")";
}

const effects = {
  pulse: { id: "test-pulse", target: { all: true }, effect: { type: "pulse", color: "#ff6a00", period_ms: 700, count: 3 } },
  flash: { id: "test-flash", target: { all: true }, effect: { type: "flash", color: "#ffffff", period_ms: 300, count: 2 } },
  wave:  { id: "test-wave",  target: { all: true }, effect: { type: "wave", color: "#2a7bff", period_ms: 1500, width: 0.3 } }
};

async function api(method, path, body) {
  const r = await fetch("/api/v1" + path, { method, headers: { "Authorization": "Bearer " + TOKEN, "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  const text = await r.text();
  log(method + " " + path + " → " + r.status + " " + text.slice(0, 120));
}

document.querySelectorAll("button[data-fx]").forEach(b => b.onclick = () => api("POST", "/trigger", effects[b.dataset.fx]));
document.getElementById("stop").onclick = () => api("DELETE", "/trigger/*");

function connect() {
  const ws = new WebSocket("ws://" + location.host + "/ws");
  ws.onopen = () => ws.send(JSON.stringify({ type: "auth", token: TOKEN }));
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === "auth_ok") {
      statusEl.textContent = "conectado";
      ws.send(JSON.stringify({ type: "subscribe", channels: ["frame", "stats", "events"] }));
    } else if (m.type === "frame") drawFrame(m.rgb);
    else if (m.type === "stats") statsEl.textContent = m.fps.toFixed(1) + " quadros/s (limite da fita: " + m.serial_max_fps.toFixed(1) + ")";
    else if (m.type === "event") log("evento " + m.event + " " + JSON.stringify(m.data));
    else if (m.type === "error") log("erro " + m.code + ": " + m.message);
  };
  ws.onclose = () => { statusEl.textContent = "desconectado, tentando de novo…"; setTimeout(connect, 2000); };
}
connect();
</script>
</body>
</html>
